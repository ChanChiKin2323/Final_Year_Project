<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cinemora.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemora — Book your seat</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. Dark is the default.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved !== 'light') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
